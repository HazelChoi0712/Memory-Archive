<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memory Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:     #050505;   /* 메인 + 상세 하단 바탕 (블랙) */
      --gray:   #0d0d0e;   /* 상세 페이지 상단 이미지 배경 */
      --ink:    #e6e8ea;   /* 기본 글자색 (차가운 오프화이트) */
      --mute:   #4f5154;   /* 비활성 글자색 */
      --line:   rgba(255,255,255,.13);
      --accent: #c2a62c;   /* 포인트: SD카드 금색 접점 */
      --mono: "Courier Prime", "Courier New", ui-monospace, Menlo, monospace;
      --sans: var(--mono);

      /* ═══════════════════════════════════════════════════════════════
         ✎ SIZE ✎  상세 페이지 크기 조절 — 여기 숫자만 바꾸면 돼요
         ═══════════════════════════════════════════════════════════════ */
      --hero-h:   78vh;            /* ✎ SIZE ✎ 맨 위 영역(큰 이미지 + intro 글)의 높이. 올리면 이미지가 커지고
                                      아래 Details/Memory 칸이 덜 보여요. 내리면 더 많이 보여요. vh = 화면 높이의 % */
      --hero-pad: 8px 3vw 16px;   /* ✎ SIZE ✎ 큰 이미지 둘레 여백 (위 오른쪽/왼쪽 아래). 줄이면 이미지가 더 커져요.
                                      위쪽 60px 은 왼쪽 위 글자(Other memories)가 이미지를 가리지 않게 비워둔 거예요 */
      --hero-fit: contain;         /* ✎ SIZE ✎ contain = 이미지 전체가 보임 / cover = 영역을 꽉 채우고 넘치는 부분은 잘림 */
      --cell-gap: 80px;            /* ✎ SIZE ✎ 칸의 제목(Details 등)과 내용 사이 간격 */
      --bar-h: 64px;               /* ✎ SIZE ✎ 맨 위 Other memories 줄의 높이 (선이 그어지는 위치) */
      --intro-pad-b: 30px;         /* ✎ SIZE ✎ 오브젝트 이름과 큰 이미지 사이 거리 */
      --deg-h:    64vh;            /* ✎ SIZE ✎ 아래 줄(Memory Degradation / Degrading...)의 최소 높이. 올리면 Degrading... 이미지가 커져요 */
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    ul { list-style: none; margin: 0; padding: 0; }

    /* ---------- 공통: 상단 바 ---------- */
    .top {
      position: fixed; inset: 0 0 auto 0; z-index: 20;
      display: flex; justify-content: space-between; align-items: center;
      padding: 22px 28px;
      font: 11px/1 var(--mono);
      text-transform: uppercase;
      letter-spacing: .04em;
      pointer-events: none;
    }
    .top a { pointer-events: auto; }
    .in-detail .top { position: absolute; }      /* 상세 페이지에서는 스크롤하면 같이 올라가요 */
    .top .count { color: var(--mute); }

    /* 왼쪽 위 버튼: 메인에서는 My Memory, 상세 페이지에서는 돌아가기 + (hover 하면) 화살표 */
    .brand { display: inline-flex; align-items: center; padding: 6px 0; transition: color .2s; }
    .brand .arr {
      width: 0; height: 10px; margin-right: 0; opacity: 0; overflow: hidden;
      color: var(--accent); flex: none;
      transition: width .28s ease, margin-right .28s ease, opacity .2s ease;
    }
    .in-detail .brand:hover,
    .in-detail .brand:focus-visible { color: var(--accent); outline: none; }
    .in-detail .brand:hover .arr,
    .in-detail .brand:focus-visible .arr { width: 20px; margin-right: 9px; opacity: 1; }

    /* ---------- 공통: 이미지 + 이미지 없을 때 어두운 자리표시 ---------- */
    .ph {
      position: absolute; inset: 0;
      background: var(--tone, #d6d2cc);
      display: grid; place-items: center;
      font: 11px var(--mono);
      text-transform: uppercase;
      letter-spacing: .06em;
      color: rgba(255,255,255,.3);
    }
    .vis > img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
    }

    /* =========================================================
       메인
    ========================================================= */
    .home {
      height: 100vh;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      overflow: hidden;
    }

    /* 왼쪽 단어 목록 */
    .list { padding-left: clamp(24px, 8vw, 140px); }
    .list a {
      display: block;
      font-size: 14px;
      line-height: 1.85;
      letter-spacing: .01em;
      color: var(--mute);
      transition: color .25s ease;
    }
    .list a.on { color: var(--accent); }

    /* 가운데 큰 이미지 (클릭하면 상세 페이지로) */
    .stage {
      position: relative; display: block;
      height: 100vh; aspect-ratio: 3 / 4; max-width: 46vw;
      overflow: hidden;
    }
    .slide {
      position: absolute; inset: 0;
      opacity: 0;
      transition: opacity .6s ease;      /* 이미지가 바뀌는 속도 */
    }
    .slide.on { opacity: 1; }

    /* SD카드 오른쪽 preview information — 왼쪽 목록에 hover 하면 그 오브젝트의 Memory Category 가 나와요 */
    .info { padding-left: clamp(24px, 4vw, 64px); }
    .info-box { display: grid; width: max-content; max-width: 100%; }
    .pinfo { grid-area: 1 / 1; opacity: 0; transition: opacity .5s ease; pointer-events: none; }
    .pinfo.on { opacity: 1; }
    .pl {                                       /* ✎ SIZE ✎ 제목 (Memory Category) */
      display: block; padding-bottom: 12px; margin-bottom: 14px; min-width: 190px;
      border-bottom: 1px solid var(--line);
      font: 10px/1 var(--mono); letter-spacing: .04em; color: var(--mute);
    }
    .pl::before { content: "■ "; font-size: 8px; vertical-align: 1px; color: var(--accent); }
    .pv li { font: 13px/1.9 var(--mono); letter-spacing: .02em; color: var(--ink); }   /* ✎ SIZE ✎ 내용 글자 크기 */

    /* =========================================================
       상세 페이지  (맨 위: 큰 이미지 + intro → 스크롤하면 네 칸)
    ========================================================= */
    .detail { min-height: 100vh; animation: fade .5s ease; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    .hero {
      height: var(--hero-h);
      display: flex; flex-direction: column;
      background: var(--gray);
    }
    .himg { flex: 1; min-height: 0; padding: var(--hero-pad); }
    .obj {                            /* 이미지 비율에 상관없이 영역 안에 맞춰서 보여요 */
      position: relative;
      width: 100%; height: 100%;
    }
    .hero .ph { background: transparent; }

    /* 상세 페이지 맨 위: 왼쪽 위 Other memories(헤더) → 선 → 가운데 오브젝트 이름 → 아래에 이미지 */
    .intro {
      position: relative;
      flex: none;
      display: flex; flex-direction: column; align-items: center; text-align: center;
      padding: calc(var(--bar-h) + 30px) 20px var(--intro-pad-b);     /* ✎ SIZE ✎ 30px 을 키우면 이름이 선에서 더 아래로 내려가요 */
    }
    .intro::before {                             /* 상단 바(Other memories)와 아래를 나누는 선 */
      content: ""; position: absolute; left: 0; right: 0; top: var(--bar-h);
      border-top: 1px solid var(--line);
    }
    .ititle {                                    /* ✎ SIZE ✎ 가운데 오브젝트 이름 */
      font: 400 13px/1 var(--mono); text-transform: uppercase; letter-spacing: .14em;
      color: var(--accent);
    }

    /* 네 칸: 왼쪽 위 Details / 오른쪽 위 Memory / 왼쪽 아래 Memory Degradation / 오른쪽 아래 Degrading... */
    .grid {
      display: grid; grid-template-columns: 1fr 1fr;
      grid-template-rows: auto minmax(var(--deg-h), auto);
      background: var(--bg);
    }
    .cell {
      position: relative;
      padding: 12px 14px 18px;
      display: flex; flex-direction: column;
      border-top: 1px solid var(--line);
    }
    .cell:nth-child(odd) { border-right: 1px solid var(--line); }
    .cell h3 {
      margin: 0;
      font: 400 10px/1 var(--mono);
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .cell h3::before { content: "■ "; font-size: 8px; vertical-align: 1px; color: var(--accent); }
    .cell h3 + * { margin-top: var(--cell-gap); }      /* 제목과 내용 사이 간격 */

    .lead {
      margin: 0;
      max-width: 46em;
      font-size: 14px; line-height: 1.65;
      white-space: pre-line;          /* 글 안에서 줄을 바꾸면 그대로 줄바꿈돼요 */
    }

    /* Memory Degradation: 문장에 마우스를 올리면 노란 블록이 되고, 시간이 지나면 서서히 사라져요 */
    .s {
      padding: 1px 4px; margin: 0 -4px;
      -webkit-box-decoration-break: clone; box-decoration-break: clone;
      transition: background .15s, color .15s;
      cursor: default;
    }
    .s:hover { background: var(--accent); color: #000; }
    .s.fading {
      opacity: var(--min-op, .18);
      transition: opacity var(--fade-ms, 4000ms) ease-in var(--fade-delay, 3000ms), background .15s, color .15s;
    }
    .s.gone { pointer-events: none; }
    .s.gone:hover { background: none; color: inherit; }

    /* 모든 문장이 사라진 뒤 서서히 나타나는 문장 */
    .remains {
      margin: 40px 0 0; max-width: 46em;
      padding-top: 12px; border-top: 1px solid var(--line);
      font-size: 14px; line-height: 1.65; color: var(--ink);
      opacity: 0;
      transition: opacity var(--remains-ms, 1500ms) ease;
    }
    .remains::before {
      content: "■ Memory Remains"; display: block; margin-bottom: 10px;
      font: 10px/1 var(--mono); letter-spacing: .04em; color: var(--accent);
    }
    .remains.show { opacity: 1; }

    /* Degrading... 칸: 틀 없이 이미지만. 문장을 hover 하면 이미지가 바뀌어요 */
    .diagram { position: relative; flex: 1; min-height: 260px; overflow: hidden; }
    .diagram .ph { background: transparent; }
    .dl { position: absolute; inset: 0; opacity: 0; transition: opacity .35s ease;     /* ← 이미지가 바뀌는 속도 */
          mix-blend-mode: lighten; }                                                  /* 이미지의 순수 검정 배경이 칸 바탕에 녹아들어요 (네모 테두리 방지) */
    .scalehint {                                                                        /* [ ] 키로 크기를 맞출 때 잠깐 나오는 안내 */
      position: absolute; left: 0; bottom: 0; z-index: 3; opacity: 0; transition: opacity .3s;
      font: 10px/1.4 var(--mono); color: var(--accent); pointer-events: none;
    }
    .scalehint.show { opacity: 1; }
    .dl.on { opacity: 1; }
    .diagram.slow .dl { transition-duration: var(--remains-ms, 3500ms); }              /* 마지막에 원본이 돌아올 때는 천천히 */

    /* 문장을 hover 할 때마다 Degrading... 제목이 깜빡여요 */
    .cell h3.blink { animation: tblink .7s steps(1, end); }
    @keyframes tblink {
      0%   { opacity: 1;   color: var(--accent); }
      14%  { opacity: .08; }
      28%  { opacity: 1;   color: var(--accent); }
      42%  { opacity: .08; }
      56%  { opacity: 1;   color: var(--accent); }
      100% { opacity: 1;   color: var(--ink); }
    }

    /* 목록형 행 (Details) */
    .rows li {
      display: flex; justify-content: space-between;
      padding: 10px 6px;
      border-bottom: 1px solid var(--line);
      font: 11px/1 var(--mono);
      text-transform: uppercase;
      letter-spacing: .02em;
    }

    /* =========================================================
       작은 화면
    ========================================================= */
    @media (max-width: 760px) {
      :root { --hero-h: 70vh; --hero-pad: 8px 4vw 12px; }
      .home { grid-template-columns: 1fr; grid-template-rows: auto 1fr; align-items: stretch; padding-top: 64px; }
      .list { display: flex; flex-wrap: wrap; gap: 2px 16px; padding: 0 20px; }
      .stage { width: 100%; height: 100%; max-width: none; aspect-ratio: auto; margin-top: 16px; }
      .top { padding: 16px 16px; }
      .top .count { display: none; }
      :root { --bar-h: 50px; }
      .info { display: none; }
      .grid { grid-template-columns: 1fr; grid-template-rows: none; }
      .cell:nth-child(odd) { border-right: 0; }
      .diagram { min-height: 280px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cell h3.blink { animation: none; }
    }
  </style>
</head>
<body>

  <header class="top">
    <a class="brand" id="brand" href="#">
      <svg class="arr" viewBox="0 0 20 10" height="10" aria-hidden="true">
        <path d="M20 5H1.5M5.5 1 1.5 5l4 4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="square" stroke-linejoin="miter"/>
      </svg>
      <span id="brandLabel">Memory Archive</span>
    </a>
    <span class="count" id="count"></span>
  </header>

  <!-- 메인 -->
  <main class="home" id="home">
    <ul class="list" id="list"></ul>
    <a class="stage" id="stage" href="#"></a>
    <aside class="info" id="info"><div class="info-box" id="infoBox"></div></aside>
  </main>

  <!-- 상세 -->
  <main class="detail" id="detail" hidden></main>

<script>
/* =========================================================================
   ★ 여기만 고치면 

   ┌────────────────────────────────────────────────────────────────────────┐
   │  찾아서 고치는 법: VS Code에서 Cmd+F (윈도우는 Ctrl+F) 로 아래 표시를 검색하세요 │
   │                                                                        │
   │   ✎ NAME ✎     왼쪽 리스트에 나오는 이름                                 │
   │   ★★★ IMAGE ★★★ 이미지 파일을 넣는 곳 (assets 폴더 안의 파일 이름)         │
   │   ✎ TEXT ✎     글을 고치는 곳                                           │
   │   ✎ SIZE ✎     상세 페이지 큰 이미지 / 간격 크기 (위쪽 <style> 맨 위)        │
   │   ✎ TIME ✎     글이 사라지는 / 나타나는 속도 (바로 아래 CONFIG)             │
   └────────────────────────────────────────────────────────────────────────┘

   이미지: index.html 옆의 assets 폴더에 넣고 "assets/파일이름.png" 로 맞춰주세요.
           파일이 없으면 어두운 칸으로 보여요.
   오브젝트를 더 늘리려면 { ... } 한 덩어리를 통째로 복사해서 붙이고,
   id 만 새 이름으로 바꾸세요 (영문 소문자, 공백 없이).
========================================================================= */

/* ---------- 화면에 나오는 공통 글 / 속도 ---------- */
const CONFIG = {
  /* ✎ TEXT ✎ 왼쪽 위 글자 */
  brand:     "Memory Archive",        /* 메인 화면에서 */
  backLabel: "Other memories",   /* 상세 페이지에서 (누르면 메인으로 돌아가요. 마우스를 올리면 화살표가 나와요) */

  /* ✎ TEXT ✎ 상세 페이지의 제목들 */
  labels: {
    category:    "Memory Category",     /* 메인 화면 SD카드 오른쪽 정보의 제목 */
    details:     "Details",
    memory:      "Memory",
    degradation: "Memory Degradation",
    degrading:   "Degrading...",
  },

  /* ✎ TIME ✎ Memory Degradation 문장이 사라지는 속도 (밀리초, 1000 = 1초)
     문장에 마우스를 올린 뒤 → [읽을 시간] 동안 그대로 있다가 → [사라지는 시간] 동안 서서히 흐려져요.
     읽을 시간 = fadeBaseMs + (문장 글자 수 × fadePerCharMs)  → 긴 문장일수록 오래 읽을 수 있어요 */
  hoverIntentMs: 250,    /* 이 시간 이상 마우스를 올려둬야 시작돼요 (지나가다 스치면 반응 안 함) */
  fadeBaseMs:    400,    /* 읽을 시간 (기본) */
  fadePerCharMs: 4,      /* 글자 하나당 더해지는 읽을 시간 */
  fadeMs:        1000,   /* 흐려지는 데 걸리는 시간 */
  minOpacity:    0.18,   /* 다 흐려졌을 때 남는 진하기 (0 = 완전히 사라짐, 1 = 그대로) */

  /* ✎ SIZE ✎ Degrading... 칸의 이미지 크기 배율 (1 = 그대로, 1.2 = 20% 크게, 0.8 = 20% 작게)
     이미지 파일마다 안에서 오브젝트가 차지하는 크기가 달라서, 이 숫자로 "원본"과 "문장 이미지"의 크기를 맞춰요.
       objectImgScale   : 원본 이미지(objectImg) — 처음 / remains 가 나올 때 돌아오는 이미지
       sentenceImgScale : 문장 이미지 전체의 기본 배율
     이미지 하나만 따로 맞추려면 그 문장 줄에  scale: 1.3  을 추가하세요. (원본은 오브젝트 맨 위 objScale: 1.3)
     ★ 쉽게 맞추는 법: 사이트에서 이미지가 보이는 상태로 키보드의 ]  (크게) / [  (작게) 를 누르면
       그 이미지 크기가 바뀌고, 칸 왼쪽 아래에 숫자가 나와요. 그 숫자를 코드에 넣으면 끝! */
  objectImgScale:   1,
  sentenceImgScale: 1,

  /* ✎ TIME ✎ 모든 문장이 사라진 뒤 */
  remainsDelayMs: 500,   /* 마지막 문장이 사라지고 나서 remains 가 나타나기 시작하기까지 */
  remainsFadeMs:  1500,  /* remains 문장 + 원본 이미지가 서서히 나타나는 시간 */
};

/* ---------- 오브젝트 목록 ---------- */
const items = [
  {
    id: "doll",     /* 주소에 쓰이는 이름이에요. 바꾸지 마세요 (이미지 파일 이름과는 상관없어요) */
    name: "Doll",     /* ✎ NAME ✎ ← 왼쪽 리스트에 나오는 이름. 여기만 바꾸면 돼요 (1번째) */

    /* ───── 이미지 ───── */
    img:       "assets/sd01.png",       /* ★★★ IMAGE ★★★ 메인 화면 가운데 큰 이미지 */
    detailImg: "assets/main1.png",    /* ★★★ IMAGE ★★★ 상세 페이지 맨 위 큰 이미지 (크기는 위쪽 CSS의 ✎ SIZE ✎ 에서 조절) */
    objectImg: "assets/main1.png",    /* ★★★ IMAGE ★★★ Degrading... 칸의 "원본" 이미지 — ① 처음 화면에 보이고 ② 마지막 remains 문장이 fade in 할 때 이 이미지도 같이 fade in 으로 돌아와요 */

    /* ───── 메인 화면 SD카드 오른쪽에 나오는 정보 ───── */

       문장을 늘리거나 줄여도 돼요 (한 줄을 복사해서 붙이면 돼요).
       img 를 "" 로 비우거나 파일이 없으면 그 문장은 그림을 바꾸지 않아요. */
    degradation: [

/* =========================================================================
   이하 동작 코드 — 건드리지 않아도 돼요
========================================================================= */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, "0");

let mode = "memory";      /* "memory" | "detail" */
let detailRun = 0;        /* 상세 페이지를 떠나거나 다시 열 때 예약된 효과를 취소하는 번호 */

// src를 따로 넘기면 그 이미지를, 안 넘기면 메인 이미지(it.img)를 보여줘요
// 이미지가 없으면(onerror) <img>만 지워져서 뒤의 어두운 칸이 보이고,
// 이미지가 잘 불러와지면(onload) 어두운 칸은 지워져요
const visual = (it, fit = "cover", src = it.img, label = it.name) =>
  `<div class="ph" style="--tone:${it.tone}"><span>${label}</span></div>
   <img src="${src}" alt="${it.name}" style="object-fit:${fit}"
        onload="this.previousElementSibling && this.previousElementSibling.remove()"
        onerror="this.remove()">`;

// 메인 구성
$("#list").innerHTML  = items.map(it => `<li><a href="#${it.id}" data-id="${it.id}">${it.name}</a></li>`).join("");
$("#stage").innerHTML = items.map(it => `<div class="slide vis" data-id="${it.id}">${visual(it)}</div>`).join("");

$("#infoBox").innerHTML = items.map(it =>
  `<div class="pinfo" data-id="${it.id}"><span class="pl">${CONFIG.labels.category}</span>` +
  `<ul class="pv">${(it.category || "").split("/").map(x => x.trim()).filter(Boolean).map(x => `<li>${x}</li>`).join("")}</ul></div>`).join("");

let activeId = items[0].id;

function updateCount() {
  const i = items.findIndex(it => it.id === activeId);
  $("#count").textContent = "MEMORY " + pad(i + 1) + " / " + pad(items.length);
}

function setActive(id) {
  activeId = id;
  document.querySelectorAll("[data-id]").forEach(el =>
    el.classList.toggle("on", el.dataset.id === id));
  if (mode === "memory") { $("#stage").href = "#" + id; updateCount(); }
}

// 단어에 마우스를 올리면 가운데 이미지가 바뀌어요
document.querySelectorAll(".list a").forEach(el => {
  el.addEventListener("mouseenter", () => { if (mode === "memory") setActive(el.dataset.id); });
  el.addEventListener("focus",      () => { if (mode === "memory") setActive(el.dataset.id); });
});

// 속도 설정을 CSS 에 넘겨요
document.documentElement.style.setProperty("--remains-ms", CONFIG.remainsFadeMs + "ms");
document.documentElement.style.setProperty("--min-op", CONFIG.minOpacity);

/* =========================================================================
   상세 페이지
========================================================================= */
const slashes = s => (s || "").split("/").map(x => x.trim()).filter(Boolean).join(" <i>/</i> ");

function blinkTitle() {
  const h = $("#degTitle");
  if (!h) return;
  h.classList.remove("blink"); void h.offsetWidth; h.classList.add("blink");
}

// Degrading... 칸: 문장 번호(k)에 맞는 이미지를 보여줘요. 이미지 파일이 없는 문장은 그림을 그대로 둬요
function showDegrade(k) {
  blinkTitle();
  const layer = document.querySelector(`#degBox .dl[data-k="${k}"]`);
  if (!layer || !layer.querySelector("img")) return;
  document.querySelectorAll("#degBox .dl").forEach(l => l.classList.toggle("on", l === layer));
}

// 모든 문장이 사라지면: remains 문장이 서서히 나타나고, Degrading... 칸에 원본 이미지가 서서히 돌아와요
function showRemains(run) {
  setTimeout(() => {
    if (run !== detailRun) return;
    const r = $("#remains");
    if (r) r.classList.add("show");
    const box = $("#degBox");
    if (box) {
      box.classList.add("slow");
      const orig = box.querySelector('.dl[data-k="0"]');
      if (orig && orig.querySelector("img"))
        box.querySelectorAll(".dl").forEach(l => l.classList.toggle("on", l === orig));
    }
    blinkTitle();
  }, CONFIG.remainsDelayMs);
}

// 문장 하나를 서서히 지워요 (한 번 시작하면 마우스가 벗어나도 계속 사라져요)
function fadeOut(el, run) {
  if (el.dataset.state) return;
  el.dataset.state = "fading";
  const delay = CONFIG.fadeBaseMs + el.textContent.length * CONFIG.fadePerCharMs;
  el.style.setProperty("--fade-delay", delay + "ms");
  el.style.setProperty("--fade-ms", CONFIG.fadeMs + "ms");
  el.classList.add("fading");
  setTimeout(() => {
    if (run !== detailRun) return;
    el.classList.add("gone");
    el.dataset.state = "gone";
    const all = [...document.querySelectorAll("#detail .s")];
    if (all.every(s => s.dataset.state === "gone")) showRemains(run);
  }, delay + CONFIG.fadeMs + 60);
}

// ] / [ 키로 지금 보이는 Degrading... 이미지의 크기를 조절해요 (숫자는 칸 왼쪽 아래에 나와요)
let hintT = null;
document.addEventListener("keydown", e => {
  if (e.key !== "]" && e.key !== "[") return;
  const layer = document.querySelector("#degBox .dl.on");
  if (!layer) return;
  const v = Math.max(0.2, Math.round((+layer.dataset.scale + (e.key === "]" ? 0.05 : -0.05)) * 100) / 100);
  layer.dataset.scale = v; layer.style.transform = `scale(${v})`;
  const k = +layer.dataset.k, h = $("#scaleHint");
  h.textContent = (k === 0 ? "objectImg (원본)" : "문장 " + k + " 이미지") + " → " + (k === 0 ? "objScale: " : "scale: ") + v;
  h.classList.add("show"); clearTimeout(hintT); hintT = setTimeout(() => h.classList.remove("show"), 3500);
});

function renderDetail(it) {
  const run = ++detailRun;
  const L = CONFIG.labels;
  const sents = it.degradation || [];
  const layers =
    `<div class="dl vis" data-k="0" data-scale="${it.objScale ?? CONFIG.objectImgScale}" style="transform:scale(${it.objScale ?? CONFIG.objectImgScale})">${visual(it, "contain", it.objectImg, it.name)}</div>` +
    sents.map((s, i) => s.img
      ? `<div class="dl vis" data-k="${i + 1}" data-scale="${s.scale ?? CONFIG.sentenceImgScale}" style="transform:scale(${s.scale ?? CONFIG.sentenceImgScale})">${visual(it, "contain", s.img, it.name + " · " + (i + 1))}</div>` : "").join("");

  $("#detail").innerHTML = `
    <section class="hero">
      <div class="intro">
        <div class="ititle">${it.name}</div>
      </div>
      <div class="himg"><div class="obj vis">${visual(it, "var(--hero-fit)", it.detailImg)}</div></div>
    </section>
    <section class="grid">
      <div class="cell">
        <h3>${L.details}</h3>
        <ul class="rows">
          ${(it.details || []).map(([k, v]) => `<li><span>${k}</span><span>${v}</span></li>`).join("")}
        </ul>
      </div>
      <div class="cell">
        <h3>${L.memory}</h3>
        <p class="lead">${it.memory || ""}</p>
      </div>
      <div class="cell">
        <h3>${L.degradation}</h3>
        <p class="lead risk">${sents.map((s, i) => `<span class="s" data-k="${i + 1}">${s.text}</span>`).join("\n\n")}</p>
        <p class="remains" id="remains">${it.remains || ""}</p>
      </div>
      <div class="cell">
        <h3 id="degTitle">${L.degrading}</h3>
        <div class="diagram" id="degBox">${layers}<div class="scalehint" id="scaleHint"></div></div>
      </div>
    </section>`;

  document.querySelectorAll("#detail .s").forEach(el => {
    const go = () => { if (run !== detailRun || el.dataset.state) return; showDegrade(+el.dataset.k); fadeOut(el, run); };
    let t = null;
    el.addEventListener("mouseenter", () => { clearTimeout(t); t = setTimeout(go, CONFIG.hoverIntentMs); });
    el.addEventListener("mouseleave", () => clearTimeout(t));
    el.addEventListener("click", () => { clearTimeout(t); go(); });          // 터치 화면용
  });
  if (!sents.length) showRemains(run);
}

/* =========================================================================
   주소(#doll 등)에 따라 메인/상세 전환
========================================================================= */
function route() {
  const it = items.find(o => "#" + o.id === location.hash);

  mode = it ? "detail" : "memory";
  document.body.classList.toggle("in-detail", !!it);
  $("#home").hidden   = !!it;
  $("#detail").hidden = !it;
  $("#count").hidden  = !!it;
  $("#brandLabel").textContent = it ? CONFIG.backLabel : CONFIG.brand;

  if (it) {
    setActive(it.id);
    renderDetail(it);
    const d = $("#detail");
    d.style.animation = "none"; void d.offsetWidth; d.style.animation = "";
    window.scrollTo(0, 0);
  } else {
    detailRun++;                 // 예약돼 있던 효과 취소
    setActive(activeId);
    updateCount();
  }
}

setActive(activeId);
window.addEventListener("hashchange", route);
route();
</script>
