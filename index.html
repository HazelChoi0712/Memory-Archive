<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memory Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:     #050505;   
      --gray:   #0d0d0e;  
      --ink:    #e6e8ea;   
      --mute:   #4f5154;   
      --line:   rgba(255,255,255,.13);
      --accent: #c2a62c;   
      --mono: "Courier Prime", "Courier New", ui-monospace, Menlo, monospace;
      --sans: var(--mono);

   
      --hero-h:   78vh;            
                                      
      --hero-pad: 8px 3vw 16px;   
                                     
      --hero-fit: contain;         
      --cell-gap: 80px;            
      --bar-h: 64px;               
      --intro-pad-b: 30px;         
      --deg-h:    64vh;            
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    ul { list-style: none; margin: 0; padding: 0; }

    .top {
      position: fixed; inset: 0 0 auto 0; z-index: 20;
      display: flex; justify-content: space-between; align-items: center;
      padding: 22px 28px;
      font: 11px/1 var(--mono);
      text-transform: uppercase;
      letter-spacing: .04em;
      pointer-events: none;
    }
    .top a { pointer-events: auto; }
    .in-detail .top { position: absolute; }      
    .top .count { color: var(--mute); }

    .brand { display: inline-flex; align-items: center; padding: 6px 0; transition: color .2s; }
    .brand .arr {
      width: 0; height: 10px; margin-right: 0; opacity: 0; overflow: hidden;
      color: var(--accent); flex: none;
      transition: width .28s ease, margin-right .28s ease, opacity .2s ease;
    }
    .in-detail .brand:hover,
    .in-detail .brand:focus-visible { color: var(--accent); outline: none; }
    .in-detail .brand:hover .arr,
    .in-detail .brand:focus-visible .arr { width: 20px; margin-right: 9px; opacity: 1; }

    .ph {
      position: absolute; inset: 0;
      background: var(--tone, #d6d2cc);
      display: grid; place-items: center;
      font: 11px var(--mono);
      text-transform: uppercase;
      letter-spacing: .06em;
      color: rgba(255,255,255,.3);
    }
    .vis > img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
    }

   
    .home {
      height: 100vh;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      overflow: hidden;
    }

    .list { padding-left: clamp(24px, 8vw, 140px); }
    .list a {
      display: block;
      font-size: 14px;
      line-height: 1.85;
      letter-spacing: .01em;
      color: var(--mute);
      transition: color .25s ease;
    }
    .list a.on { color: var(--accent); }

    .stage {
      position: relative; display: block;
      height: 100vh; aspect-ratio: 3 / 4; max-width: 46vw;
      overflow: hidden;
    }
    .slide {
      position: absolute; inset: 0;
      opacity: 0;
      transition: opacity .6s ease;      /* 이미지가 바뀌는 속도 */
    }
    .slide.on { opacity: 1; }

    .info { padding-left: clamp(24px, 4vw, 64px); }
    .info-box { display: grid; width: max-content; max-width: 100%; }
    .pinfo { grid-area: 1 / 1; opacity: 0; transition: opacity .5s ease; pointer-events: none; }
    .pinfo.on { opacity: 1; }
    .pl {                                      
      display: block; padding-bottom: 12px; margin-bottom: 14px; min-width: 190px;
      border-bottom: 1px solid var(--line);
      font: 10px/1 var(--mono); letter-spacing: .04em; color: var(--mute);
    }
    .pl::before { content: "■ "; font-size: 8px; vertical-align: 1px; color: var(--accent); }
    .pv li { font: 13px/1.9 var(--mono); letter-spacing: .02em; color: var(--ink); }   /* ✎ SIZE ✎ 내용 글자 크기 */

    
    .detail { min-height: 100vh; animation: fade .5s ease; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    .hero {
      height: var(--hero-h);
      display: flex; flex-direction: column;
      background: var(--gray);
    }
    .himg { flex: 1; min-height: 0; padding: var(--hero-pad); }
    .obj {                           
      position: relative;
      width: 100%; height: 100%;
    }
    .hero .ph { background: transparent; }

    .intro {
      position: relative;
      flex: none;
      display: flex; flex-direction: column; align-items: center; text-align: center;
      padding: calc(var(--bar-h) + 30px) 20px var(--intro-pad-b);    
    }
    .intro::before {                           
      content: ""; position: absolute; left: 0; right: 0; top: var(--bar-h);
      border-top: 1px solid var(--line);
    }
    .ititle {                                    
      font: 400 13px/1 var(--mono); text-transform: uppercase; letter-spacing: .14em;
      color: var(--accent);
    }

    .grid {
      display: grid; grid-template-columns: 1fr 1fr;
      grid-template-rows: auto minmax(var(--deg-h), auto);
      background: var(--bg);
    }
    .cell {
      position: relative;
      padding: 12px 14px 18px;
      display: flex; flex-direction: column;
      border-top: 1px solid var(--line);
    }
    .cell:nth-child(odd) { border-right: 1px solid var(--line); }
    .cell h3 {
      margin: 0;
      font: 400 10px/1 var(--mono);
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .cell h3::before { content: "■ "; font-size: 8px; vertical-align: 1px; color: var(--accent); }
    .cell h3 + * { margin-top: var(--cell-gap); }      

    .lead {
      margin: 0;
      max-width: 46em;
      font-size: 14px; line-height: 1.65;
      white-space: pre-line;          
    }

    .s {
      padding: 1px 4px; margin: 0 -4px;
      -webkit-box-decoration-break: clone; box-decoration-break: clone;
      transition: background .15s, color .15s;
      cursor: default;
    }
    .s:hover { background: var(--accent); color: #000; }
    .s.fading {
      opacity: var(--min-op, .18);
      transition: opacity var(--fade-ms, 4000ms) ease-in var(--fade-delay, 3000ms), background .15s, color .15s;
    }
    .s.gone { pointer-events: none; }
    .s.gone:hover { background: none; color: inherit; }

    .remains {
      margin: 40px 0 0; max-width: 46em;
      padding-top: 12px; border-top: 1px solid var(--line);
      font-size: 14px; line-height: 1.65; color: var(--ink);
      opacity: 0;
      transition: opacity var(--remains-ms, 1500ms) ease;
    }
    .remains::before {
      content: "■ Memory Remains"; display: block; margin-bottom: 10px;
      font: 10px/1 var(--mono); letter-spacing: .04em; color: var(--accent);
    }
    .remains.show { opacity: 1; }

    .diagram { position: relative; flex: 1; min-height: 260px; overflow: hidden; }
    .diagram .ph { background: transparent; }
    .dl { position: absolute; inset: 0; opacity: 0; transition: opacity .35s ease;     
          mix-blend-mode: lighten; }                                                 
    .scalehint {                                                                        
      position: absolute; left: 0; bottom: 0; z-index: 3; opacity: 0; transition: opacity .3s;
      font: 10px/1.4 var(--mono); color: var(--accent); pointer-events: none;
    }
    .scalehint.show { opacity: 1; }
    .dl.on { opacity: 1; }
    .diagram.slow .dl { transition-duration: var(--remains-ms, 3500ms); }             

    .cell h3.blink { animation: tblink .7s steps(1, end); }
    @keyframes tblink {
      0%   { opacity: 1;   color: var(--accent); }
      14%  { opacity: .08; }
      28%  { opacity: 1;   color: var(--accent); }
      42%  { opacity: .08; }
      56%  { opacity: 1;   color: var(--accent); }
      100% { opacity: 1;   color: var(--ink); }
    }

    .rows li {
      display: flex; justify-content: space-between;
      padding: 10px 6px;
      border-bottom: 1px solid var(--line);
      font: 11px/1 var(--mono);
      text-transform: uppercase;
      letter-spacing: .02em;
    }

   
    @media (max-width: 760px) {
      :root { --hero-h: 70vh; --hero-pad: 8px 4vw 12px; }
      .home { grid-template-columns: 1fr; grid-template-rows: auto 1fr; align-items: stretch; padding-top: 64px; }
      .list { display: flex; flex-wrap: wrap; gap: 2px 16px; padding: 0 20px; }
      .stage { width: 100%; height: 100%; max-width: none; aspect-ratio: auto; margin-top: 16px; }
      .top { padding: 16px 16px; }
      .top .count { display: none; }
      :root { --bar-h: 50px; }
      .info { display: none; }
      .grid { grid-template-columns: 1fr; grid-template-rows: none; }
      .cell:nth-child(odd) { border-right: 0; }
      .diagram { min-height: 280px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cell h3.blink { animation: none; }
    }
  </style>
</head>
<body>

  <header class="top">
    <a class="brand" id="brand" href="#">
      <svg class="arr" viewBox="0 0 20 10" height="10" aria-hidden="true">
        <path d="M20 5H1.5M5.5 1 1.5 5l4 4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="square" stroke-linejoin="miter"/>

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, "0");

let mode = "memory";     
let detailRun = 0;       

// src를 따로 넘기면 그 이미지를, 안 넘기면 메인 이미지(it.img)를 보여줘요
// 이미지가 없으면(onerror) <img>만 지워져서 뒤의 어두운 칸이 보이고,
// 이미지가 잘 불러와지면(onload) 어두운 칸은 지워져요
const visual = (it, fit = "cover", src = it.img, label = it.name) =>
  `<div class="ph" style="--tone:${it.tone}"><span>${label}</span></div>
   <img src="${src}" alt="${it.name}" style="object-fit:${fit}"
        onload="this.previousElementSibling && this.previousElementSibling.remove()"
        onerror="this.remove()">`;

// 메인 구성
$("#list").innerHTML  = items.map(it => `<li><a href="#${it.id}" data-id="${it.id}">${it.name}</a></li>`).join("");
$("#stage").innerHTML = items.map(it => `<div class="slide vis" data-id="${it.id}">${visual(it)}</div>`).join("");

$("#infoBox").innerHTML = items.map(it =>
  `<div class="pinfo" data-id="${it.id}"><span class="pl">${CONFIG.labels.category}</span>` +
  `<ul class="pv">${(it.category || "").split("/").map(x => x.trim()).filter(Boolean).map(x => `<li>${x}</li>`).join("")}</ul></div>`).join("");

let activeId = items[0].id;

function updateCount() {
  const i = items.findIndex(it => it.id === activeId);
  $("#count").textContent = "MEMORY " + pad(i + 1) + " / " + pad(items.length);
}

function setActive(id) {
  activeId = id;
  document.querySelectorAll("[data-id]").forEach(el =>
    el.classList.toggle("on", el.dataset.id === id));
  if (mode === "memory") { $("#stage").href = "#" + id; updateCount(); }
}

document.querySelectorAll(".list a").forEach(el => {
  el.addEventListener("mouseenter", () => { if (mode === "memory") setActive(el.dataset.id); });
  el.addEventListener("focus",      () => { if (mode === "memory") setActive(el.dataset.id); });
});

document.documentElement.style.setProperty("--remains-ms", CONFIG.remainsFadeMs + "ms");
document.documentElement.style.setProperty("--min-op", CONFIG.minOpacity);


const slashes = s => (s || "").split("/").map(x => x.trim()).filter(Boolean).join(" <i>/</i> ");

function blinkTitle() {
  const h = $("#degTitle");
  if (!h) return;
  h.classList.remove("blink"); void h.offsetWidth; h.classList.add("blink");
}

function showDegrade(k) {
  blinkTitle();
  const layer = document.querySelector(`#degBox .dl[data-k="${k}"]`);
  if (!layer || !layer.querySelector("img")) return;
  document.querySelectorAll("#degBox .dl").forEach(l => l.classList.toggle("on", l === layer));
}

function showRemains(run) {
  setTimeout(() => {
    if (run !== detailRun) return;
    const r = $("#remains");
    if (r) r.classList.add("show");
    const box = $("#degBox");
    if (box) {
      box.classList.add("slow");
      const orig = box.querySelector('.dl[data-k="0"]');
      if (orig && orig.querySelector("img"))
        box.querySelectorAll(".dl").forEach(l => l.classList.toggle("on", l === orig));
    }
    blinkTitle();
  }, CONFIG.remainsDelayMs);
}

function fadeOut(el, run) {
  if (el.dataset.state) return;
  el.dataset.state = "fading";
  const delay = CONFIG.fadeBaseMs + el.textContent.length * CONFIG.fadePerCharMs;
  el.style.setProperty("--fade-delay", delay + "ms");
  el.style.setProperty("--fade-ms", CONFIG.fadeMs + "ms");
  el.classList.add("fading");
  setTimeout(() => {
    if (run !== detailRun) return;
    el.classList.add("gone");
    el.dataset.state = "gone";
    const all = [...document.querySelectorAll("#detail .s")];
    if (all.every(s => s.dataset.state === "gone")) showRemains(run);
  }, delay + CONFIG.fadeMs + 60);
}

let hintT = null;
document.addEventListener("keydown", e => {
  if (e.key !== "]" && e.key !== "[") return;
  const layer = document.querySelector("#degBox .dl.on");
  if (!layer) return;
  const v = Math.max(0.2, Math.round((+layer.dataset.scale + (e.key === "]" ? 0.05 : -0.05)) * 100) / 100);
  layer.dataset.scale = v; layer.style.transform = `scale(${v})`;
  const k = +layer.dataset.k, h = $("#scaleHint");
  h.textContent = (k === 0 ? "objectImg (원본)" : "문장 " + k + " 이미지") + " → " + (k === 0 ? "objScale: " : "scale: ") + v;
  h.classList.add("show"); clearTimeout(hintT); hintT = setTimeout(() => h.classList.remove("show"), 3500);
});

function renderDetail(it) {
  const run = ++detailRun;
  const L = CONFIG.labels;
  const sents = it.degradation || [];
  const layers =
    `<div class="dl vis" data-k="0" data-scale="${it.objScale ?? CONFIG.objectImgScale}" style="transform:scale(${it.objScale ?? CONFIG.objectImgScale})">${visual(it, "contain", it.objectImg, it.name)}</div>` +
    sents.map((s, i) => s.img
      ? `<div class="dl vis" data-k="${i + 1}" data-scale="${s.scale ?? CONFIG.sentenceImgScale}" style="transform:scale(${s.scale ?? CONFIG.sentenceImgScale})">${visual(it, "contain", s.img, it.name + " · " + (i + 1))}</div>` : "").join("");

  $("#detail").innerHTML = `
    <section class="hero">
      <div class="intro">
        <div class="ititle">${it.name}</div>
      </div>
      <div class="himg"><div class="obj vis">${visual(it, "var(--hero-fit)", it.detailImg)}</div></div>
    </section>
    <section class="grid">
      <div class="cell">
        <h3>${L.details}</h3>
        <ul class="rows">
          ${(it.details || []).map(([k, v]) => `<li><span>${k}</span><span>${v}</span></li>`).join("")}
        </ul>
      </div>
      <div class="cell">
        <h3>${L.memory}</h3>
        <p class="lead">${it.memory || ""}</p>
      </div>
      <div class="cell">
        <h3>${L.degradation}</h3>
        <p class="lead risk">${sents.map((s, i) => `<span class="s" data-k="${i + 1}">${s.text}</span>`).join("\n\n")}</p>
        <p class="remains" id="remains">${it.remains || ""}</p>
      </div>
      <div class="cell">
        <h3 id="degTitle">${L.degrading}</h3>
        <div class="diagram" id="degBox">${layers}<div class="scalehint" id="scaleHint"></div></div>
      </div>
    </section>`;

  document.querySelectorAll("#detail .s").forEach(el => {
    const go = () => { if (run !== detailRun || el.dataset.state) return; showDegrade(+el.dataset.k); fadeOut(el, run); };
    let t = null;
    el.addEventListener("mouseenter", () => { clearTimeout(t); t = setTimeout(go, CONFIG.hoverIntentMs); });
    el.addEventListener("mouseleave", () => clearTimeout(t));
    el.addEventListener("click", () => { clearTimeout(t); go(); });          // 터치 화면용
  });
  if (!sents.length) showRemains(run);
}


function route() {
  const it = items.find(o => "#" + o.id === location.hash);

  mode = it ? "detail" : "memory";
  document.body.classList.toggle("in-detail", !!it);
  $("#home").hidden   = !!it;
  $("#detail").hidden = !it;
  $("#count").hidden  = !!it;
  $("#brandLabel").textContent = it ? CONFIG.backLabel : CONFIG.brand;

  if (it) {
    setActive(it.id);
    renderDetail(it);
    const d = $("#detail");
    d.style.animation = "none"; void d.offsetWidth; d.style.animation = "";
    window.scrollTo(0, 0);
  } else {
    detailRun++;                
    setActive(activeId);
    updateCount();
  }
}

setActive(activeId);
window.addEventListener("hashchange", route);
route();
</script>
